name: Release

# Publishes a release whenever main carries a mod.json version that has no
# release yet: raise the version, add its CHANGELOG section, push to main.
# The zip is built here from that commit, never uploaded by hand, so every
# release can be read in this repository. It can also be run by hand from
# the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find this version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("eden-rework-2021/mod.json"))["version"])')
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "v${version} is already released"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.version.outputs.new == 'true'
        run: |
          python3 scripts/build-release.py
          python3 scripts/build-release.py --notes > notes.md
      - name: Publish
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
