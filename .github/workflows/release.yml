name: Release

# Push a tag v<version> matching eden-rework-2021/mod.json to publish a
# release. The zip is built here from the tagged commit, never uploaded by
# hand, so every release can be read in this repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match mod.json
        run: |
          version=$(python3 -c 'import json; print(json.load(open("eden-rework-2021/mod.json"))["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod.json version ${version}" >&2
            exit 1
          fi
      - name: Build
        run: |
          python3 scripts/build-release.py
          python3 scripts/build-release.py --notes > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
