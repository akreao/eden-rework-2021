name: Delete release

# Removes a published release and its tag, for when a release should no
# longer be offered. Run it by hand from the Actions tab with the tag
# (for example v0.2.6).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to delete, e.g. v0.2.6
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
